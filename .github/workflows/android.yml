name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- CORREÇÃO GERAL (TODAS AS PASTAS) ---
    - name: Corrigir Sintaxe Gradle (Recursivo)
      run: |
        # O comando 'find' procura arquivos .gradle em TODAS as subpastas
        # O comando 'sed' troca url "..." por url = "..."
        find . -name "*.gradle" -type f -exec sed -i 's/url "/url = "/g' {} +
        find . -name "*.gradle" -type f -exec sed -i "s/url '/url = '/g" {} +
        
        # Correção extra para garantir (caso haja espaços extras)
        find . -name "*.gradle" -type f -exec sed -i 's/url  "/url = "/g' {} +

    - name: Build with Gradle
      # Mantendo a memória alta (6GB)
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Meus-APKs
        path: '**/*.apk'
