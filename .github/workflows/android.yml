name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- NOVO PASSO: CORREÇÃO AUTOMÁTICA DO CÓDIGO ---
    - name: Corrigir Sintaxe do Gradle (Fix Deprecation)
      run: |
        # Procura por url "http..." e troca por url = "http..." no build.gradle
        sed -i 's/url "/url = "/g' build.gradle
        sed -i "s/url '/url = '/g" build.gradle
        # Às vezes o problema está no settings.gradle também
        if [ -f settings.gradle ]; then
          sed -i 's/url "/url = "/g' settings.gradle
          sed -i "s/url '/url = '/g" settings.gradle
        fi

    - name: Build with Gradle
      # Mantivemos a memória aumentada (6GB) para não travar
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Meus-APKs
        path: '**/*.apk'
