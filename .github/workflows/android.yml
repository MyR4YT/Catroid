name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive  # 1. Garante que baixe partes extras do projeto

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # 2. --no-daemon: economiza memória
      # 3. -Dorg.gradle.jvmargs: força o uso de 6GB de RAM (o limite é 7GB)
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Meus-APKs
        path: '**/*.apk'
